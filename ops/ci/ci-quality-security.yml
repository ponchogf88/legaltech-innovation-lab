name: CI Quality & Security Gate

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
      - "dev/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-and-tests:
    name: Backend Security, Continuity & Unit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legal_engine with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enforce PII, Secret, and Governance Guardrails
        run: python -m legal_engine.cli security-check

      - name: Run Python Unit, Continuity & CI Contract Suites
        run: pytest -v -k "not e2e_playwright"

      - name: Verify Synthetic CLI Demo, Audit Chain & Continuity Clock
        run: |
          python -m legal_engine.cli demo --stop-before-submit
          python -m legal_engine.cli demo --audit-log /tmp/ci-demo.audit.jsonl
          python -m legal_engine.cli verify-audit --log /tmp/ci-demo.audit.jsonl
          python -m legal_engine.cli clock
          python -m legal_engine.cli state

  frontend-build-and-e2e:
    name: Command Center Build & Playwright E2E Gate
    runs-on: ubuntu-latest
    needs: backend-security-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies and Playwright Chromium
        working-directory: apps/command-center
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@^1.44.0
          npx playwright install --with-deps chromium

      - name: Build Command Center Production Bundle
        working-directory: apps/command-center
        run: npm run build

      - name: Run Playwright Headless E2E Suite
        working-directory: apps/command-center
        run: npm run test:e2e
