[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legaltech-innovation-lab"
version = "0.1.0"
description = "Orchestrated LegalTech Innovation Lab: Human-in-the-Loop legal workflow engine, privacy/AI governance guardrails, and Command Center UI (synthetic data only)"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
